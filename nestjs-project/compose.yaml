services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  # Same image and code as nestjs-api, running the worker entrypoint
  # (src/worker.ts): consumes the video queues, no HTTP port (TD-08).
  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run start:worker:dev
    restart: unless-stopped
    # The container's main process is `nest start --watch`, which outlives the
    # worker child: if the worker dies, the container stays "running". This
    # check makes `docker compose ps` show "unhealthy" in that case.
    # Exec form (no shell) so the check's own command line can't match.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "dist/worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY_ID}
      - RUSTFS_SECRET_KEY=${S3_SECRET_ACCESS_KEY}
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket (idempotent) and applies the versioned CORS policy.
  storage-init:
    image: amazon/aws-cli:2.39.3
    depends_on:
      storage:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${S3_REGION}
      - AWS_REQUEST_CHECKSUM_CALCULATION=when_required
      - AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
      - S3_BUCKET=${S3_BUCKET}
    volumes:
      - ./docker/storage:/cors:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ENDPOINT=http://storage:9000
        aws --endpoint-url "$$ENDPOINT" s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null \
          || aws --endpoint-url "$$ENDPOINT" s3api create-bucket --bucket "$$S3_BUCKET"
        aws --endpoint-url "$$ENDPOINT" s3api put-bucket-cors --bucket "$$S3_BUCKET" \
          --cors-configuration file:///cors/cors.json
        echo "storage-init: bucket $$S3_BUCKET ready"

volumes:
  redis-data:
  storage-data:
